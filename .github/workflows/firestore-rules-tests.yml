name: Test Firestore Security Rules

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - 'functions/**'
      - 'checkout-functions/**'
      - 'checkout/**'
      - 'equipment-checkout.html'
      - '.github/workflows/firestore-rules-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - 'functions/**'
      - 'checkout-functions/**'
      - 'checkout/**'
      - 'equipment-checkout.html'
      - '.github/workflows/firestore-rules-tests.yml'

permissions:
  contents: read

jobs:
  rules_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Check Firebase Functions syntax
        run: |
          node --check functions/index.js
          node --check checkout-functions/index.js
          node --check checkout-functions/service.js
          node --check checkout-functions/delivery.js
          node --check checkout-functions/loan-policy.js
          node --check checkout/loan-status.mjs
          node --check checkout/history-view.mjs
          node --check checkout/app.js

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test dependencies
        run: |
          npm ci --prefix tests
          npm ci --prefix checkout-functions

      - name: Run Firestore rules tests
        run: npx firebase-tools@latest emulators:exec --only firestore --project demo-tad-checkout "npm --prefix checkout-functions test && npm --prefix tests test"
