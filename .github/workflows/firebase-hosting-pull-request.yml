name: Deploy Firebase Hosting Preview

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use approved Kongsberg image
        run: cp kongsberg-v-tad.jpg assets/kongsberg-v-tad.jpg

      - name: Deploy to Firebase Hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAD_LAB_MANAGER }}
          projectId: tad-lab-manager
          expires: 7d
